on:
  push:
    branches:
      - main
  pull_request:

name: Go
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v7.0.1

    - name: Install Go
      uses: actions/setup-go@v7.0.0
      with:
        go-version-file: go.mod

    - name: Get dependencies
      run: go mod download

    - name: Build
      run: go build -v .

    - name: Test
      run: go test -v -race ./...

    - name: Vet
      run: go vet ./...

    - name: Lint
      uses: dominikh/staticcheck-action@v1.4.1
      with:
        version: "latest"
        install-go: false
        cache-key: ${{ hashFiles('go.mod') }}
